<form (ngSubmit)="handleFormSubmission(newCategoryForm)" #newCategoryForm="ngForm" class="new-edit-category-form p-2">
    @if(isEditMode){
    <h2>Editar categoría</h2>
    } @else {
    <h2>Nueva categoría</h2>
    }
    <div class="mb-2">
        <label for="category-name" class="form-label small text-muted">Nombre de la categoría</label>
        <input id="category-name" name="name" class="form-control form-control-sm" [(ngModel)]="name"
            placeholder="Ej: Bebidas" required [disabled]="isLoading" />
    </div>
    <div class="d-flex justify-content-end gap-2">
        <a class="btn btn-sm btn-outline-secondary me-auto"
            [routerLink]="['/admin-page/'+ restaurantService.getUserId()]">Volver</a>
        <button type="submit" class="btn btn-sm btn-primary" [disabled]="isLoading">
            @if (isLoading) {
            <span>Guardando...</span>
            } @else {
            <span>Guardar</span>
            }
        </button>
    </div>
</form>
