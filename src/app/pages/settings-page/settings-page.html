<div class="settings-page container py-4">
	<div class="row justify-content-center">
		<div class="col-12 col-md-8">
			<div class="card shadow-sm">
				<div class="card-body">
					<h3 class="card-title mb-3">Configuración</h3>

					<section class="mb-4">
						<h6 class="mb-2">{{restaurantService.getRestaurantName()}}</h6>
						<p class="text-muted small">Cambia el nombre que verán los usuarios.</p>
						<div class="input-group mb-2">
							<input class="form-control" type="text" placeholder="Nuevo nombre" [(ngModel)]="name"
								[disabled]="isLoading" />
							<button class="btn btn-primary" [disabled]="!name || isLoading" (click)="changeName()">
								@if (isLoading) { <span class="spinner-border spinner-border-sm me-2"
									role="status"></span> } @else { Guardar }
							</button>
						</div>
						@if (successMessage) {
						<div class="alert alert-success small py-2">{{ successMessage }}</div>
						}
					</section>

					<section class="mt-3">
						<h6 class="mb-2 text-danger">Borrar cuenta</h6>
						<p class="text-muted small">Esta acción eliminará permanentemente tu restaurante y todos sus
							datos.</p>
						<button class="btn btn-outline-danger" (click)="id && deleteRestaurantModal(id)">Borrar
							cuenta</button>
					</section>
				</div>
			</div>
		</div>
	</div>
</div>
