<!--
  Referencias de estructura y estilos:
  - Bootstrap 5.3 Forms (overview): https://getbootstrap.com/docs/5.3/forms/overview/
  - Bootstrap 5.3 Input group: https://getbootstrap.com/docs/5.3/forms/input-group/
  - Bootstrap 5.3 Buttons: https://getbootstrap.com/docs/5.3/components/buttons/
  - Bootstrap 5.3 Cards: https://getbootstrap.com/docs/5.3/components/card/
  - Bootstrap 5.3 Utilities (spacing, shadows):
    https://getbootstrap.com/docs/5.3/utilities/spacing/
    https://getbootstrap.com/docs/5.3/utilities/shadows/
  - Angular Control Flow (@if / @for): https://angular.dev/guide/templates/control-flow
-->
<div class="register-container bg-white">
  <div class="register-card card shadow-sm border-0">
    <div class="brand-section text-center mb-4">
      <div class="brand-icon mx-auto mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c.966 0 1.89.166 2.75.47a.75.75 0 0 0 1-.708V4.262a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
        </svg>
      </div>
      <h1 class="brand-title mb-2">Crear Cuenta</h1>
      <p class="brand-subtitle text-muted">Unite a nuestra comunidad</p>
    </div>

    <form (ngSubmit)="register(registerForm.form.value)" #registerForm="ngForm" class="mt-3">
      <!-- First Name Input -->
      <div class="mb-3">
        <label for="firstName" class="form-label fw-semibold">Nombre</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="firstName" name="firstName" placeholder="Juan"
            ngModel required />
        </div>
      </div>

      <!-- Last Name Input -->
      <div class="mb-3">
        <label for="lastName" class="form-label fw-semibold">Apellido</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="lastName" name="lastName" placeholder="Pérez"
            ngModel required />
        </div>
      </div>

      <!-- Restaurant Name Input -->
      <div class="mb-3">
        <label for="restaurantName" class="form-label fw-semibold">Nombre del restaurante</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path d="M5.223 2.25c-.497 0-.974.198-1.325.55l-1.3 1.298A3.75 3.75 0 0 0 7.5 9.75c.627.47 1.406.75 2.25.75.844 0 1.624-.28 2.25-.75.626.47 1.406.75 2.25.75.844 0 1.623-.28 2.25-.75a3.75 3.75 0 0 0 4.902-5.652l-1.3-1.299a1.875 1.875 0 0 0-1.325-.549H5.223Z" />
              <path fill-rule="evenodd" d="M3 20.25v-8.755c1.42.674 3.08.673 4.5 0A5.234 5.234 0 0 0 9.75 12c.804 0 1.568-.182 2.25-.506a5.234 5.234 0 0 0 2.25.506c.804 0 1.567-.182 2.25-.506 1.42.674 3.08.675 4.5.001v8.755h.75a.75.75 0 0 1 0 1.5H2.25a.75.75 0 0 1 0-1.5H3Zm3-6a.75.75 0 0 1 .75-.75h3a.75.75 0 0 1 .75.75v3a.75.75 0 0 1-.75.75h-3a.75.75 0 0 1-.75-.75v-3Zm8.25-.75a.75.75 0 0 0-.75.75v5.25c0 .414.336.75.75.75h3a.75.75 0 0 0 .75-.75v-5.25a.75.75 0 0 0-.75-.75h-3Z" clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="restaurantName" name="restaurantName" placeholder="Mi Restaurante"
            ngModel required />
        </div>
      </div>

      <!-- Address Input -->
      <div class="mb-3">
        <label for="address" class="form-label fw-semibold">Dirección</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd" d="m11.54 22.351.07.04.028.016a.76.76 0 0 0 .723 0l.028-.015.071-.041a16.975 16.975 0 0 0 1.144-.742 19.58 19.58 0 0 0 2.683-2.282c1.944-1.99 3.963-4.98 3.963-8.827a8.25 8.25 0 0 0-16.5 0c0 3.846 2.02 6.837 3.963 8.827a19.58 19.58 0 0 0 2.682 2.282 16.975 16.975 0 0 0 1.145.742ZM12 13.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="address" name="address" placeholder="9 de Julio 001"
            ngModel required />
        </div>
      </div>

      <!-- Phone Number Input -->
      <div class="mb-3">
        <label for="phoneNumber" class="form-label fw-semibold">Teléfono</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd" d="M1.5 4.5a3 3 0 0 1 3-3h1.372c.86 0 1.61.586 1.819 1.42l1.105 4.423a1.875 1.875 0 0 1-.694 1.955l-1.293.97c-.135.101-.164.249-.126.352a11.285 11.285 0 0 0 6.697 6.697c.103.038.25.009.352-.126l.97-1.293a1.875 1.875 0 0 1 1.955-.694l4.423 1.105c.834.209 1.42.959 1.42 1.82V19.5a3 3 0 0 1-3 3h-2.25C8.552 22.5 1.5 15.448 1.5 6.75V4.5Z" clip-rule="evenodd" />
            </svg>
          </span>
          <input type="tel" class="form-control border-start-0" id="phoneNumber" name="phoneNumber" placeholder="1234567890"
            ngModel required />
        </div>
      </div>

      <!-- Password Input -->
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="password" class="form-control border-start-0" id="password" name="password"
            placeholder="••••••••" ngModel required />
        </div>
      </div>

      <!-- Confirm Password Input -->
      <div class="mb-3">
        <label for="password2" class="form-label fw-semibold">Confirmar contraseña</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="password" class="form-control border-start-0" id="password2" name="password2"
            placeholder="••••••••" ngModel required />
        </div>
      </div>

      @if (errorRegister) {
      <div class="alert alert-danger mb-3" role="alert">
        Por favor, completa todos los campos correctamente y asegúrate de que las contraseñas coincidan.
      </div>
      }

      <button type="submit" class="btn btn-danger w-100 py-3 mb-3 fw-bold text-uppercase" [disabled]="isLoading">
        @if (isLoading) {
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span>Creando cuenta...</span>
        } @else {
        <span>Crear cuenta</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="ms-2"
          style="width: 20px; height: 20px; display: inline-block;">
          <path fill-rule="evenodd"
            d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z"
            clip-rule="evenodd" />
        </svg>
        }
      </button>
    </form>

    <div class="footer-link text-center pt-3 border-top">
      <p class="text-muted mb-0">
        ¿Ya tienes una cuenta?
        <a routerLink="/login" class="btn btn-link p-0 ms-1 login-link fw-semibold">
          Inicia sesión
        </a>
      </p>
    </div>
  </div>
</div>
