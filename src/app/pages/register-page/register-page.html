<div class="register-container">
  <!-- Background decorations -->
  <div class="bg-decoration circle-1"></div>
  <div class="bg-decoration circle-2"></div>
  <div class="bg-decoration circle-3"></div>

  <!-- Register Card -->
  <div class="register-card card shadow-lg border-0">
    <!-- Logo/Brand Section -->
    <div class="brand-section text-center mb-4">
      <div class="brand-icon mx-auto mb-3">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor">
          <path
            d="M11.25 4.533A9.707 9.707 0 0 0 6 3a9.735 9.735 0 0 0-3.25.555.75.75 0 0 0-.5.707v14.25a.75.75 0 0 0 1 .707A8.237 8.237 0 0 1 6 18.75c1.995 0 3.823.707 5.25 1.886V4.533ZM12.75 20.636A8.214 8.214 0 0 1 18 18.75c.966 0 1.89.166 2.75.47a.75.75 0 0 0 1-.708V4.262a.75.75 0 0 0-.5-.707A9.735 9.735 0 0 0 18 3a9.707 9.707 0 0 0-5.25 1.533v16.103Z" />
        </svg>
      </div>
      <h1 class="brand-title mb-2">Crear Cuenta</h1>
      <p class="brand-subtitle text-muted">Unite a nuestra comunidad</p>
    </div>

    <form (ngSubmit)="register(registerForm.form.value)" #registerForm="ngForm">
      <div class="mb-3">
        <label for="firstName" class="form-label fw-semibold">Nombre</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="firstName" name="firstName" placeholder="Juan"
            ngModel required />
        </div>
      </div>

      <!-- Last Name Input -->
      <div class="mb-3">
        <label for="lastName" class="form-label fw-semibold">Apellido</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M7.5 6a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM3.751 20.105a8.25 8.25 0 0 1 16.498 0 .75.75 0 0 1-.437.695A18.683 18.683 0 0 1 12 22.5c-2.786 0-5.433-.608-7.812-1.7a.75.75 0 0 1-.437-.695Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="text" class="form-control border-start-0" id="lastName" name="lastName" placeholder="Pérez"
            ngModel required />
        </div>
      </div>

      <!-- Email Input -->
      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Correo electrónico</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path d="M1.5 8.67v8.58a3 3 0 0 0 3 3h15a3 3 0 0 0 3-3V8.67l-8.928 5.493a3 3 0 0 1-3.144 0L1.5 8.67Z" />
              <path
                d="M22.5 6.908V6.75a3 3 0 0 0-3-3h-15a3 3 0 0 0-3 3v.158l9.714 5.978a1.5 1.5 0 0 0 1.572 0L22.5 6.908Z" />
            </svg>
          </span>
          <input type="email" class="form-control border-start-0" id="email" name="email" placeholder="tu@email.com"
            ngModel required />
        </div>
      </div>

      <!-- Password Input -->
      <div class="mb-3">
        <label for="password" class="form-label fw-semibold">Contraseña</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="password" class="form-control border-start-0"
            id="password" name="password" placeholder="••••••••" ngModel required />
        </div>
      </div>

      <div class="mb-3">
        <label for="password2" class="form-label fw-semibold">Confirmar contraseña</label>
        <div class="input-group input-group-custom">
          <span class="input-group-text bg-transparent border-end-0">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="input-icon">
              <path fill-rule="evenodd"
                d="M12 1.5a5.25 5.25 0 0 0-5.25 5.25v3a3 3 0 0 0-3 3v6.75a3 3 0 0 0 3 3h10.5a3 3 0 0 0 3-3v-6.75a3 3 0 0 0-3-3v-3c0-2.9-2.35-5.25-5.25-5.25Zm3.75 8.25v-3a3.75 3.75 0 1 0-7.5 0v3h7.5Z"
                clip-rule="evenodd" />
            </svg>
          </span>
          <input type="password" class="form-control border-start-0"
            id="password2" name="password2" placeholder="••••••••"
            ngModel required />
        </div>
      </div>

      <!-- Error Message -->
      @if (errorRegister) {
      <div class="alert alert-danger mb-3" role="alert">
        Por favor, completa todos los campos correctamente y asegúrate de que las contraseñas coincidan.
      </div>
      }

      <!-- Submit Button -->
      <button type="submit" class="btn btn-mcdonalds w-100 py-3 mb-3 fw-bold text-uppercase" [disabled]="isLoading">
        @if (isLoading) {
        <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
        <span>Creando cuenta...</span>
        } @else {
        <span>Crear cuenta</span>
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="ms-2"
          style="width: 20px; height: 20px; display: inline-block;">
          <path fill-rule="evenodd"
            d="M12.97 3.97a.75.75 0 0 1 1.06 0l7.5 7.5a.75.75 0 0 1 0 1.06l-7.5 7.5a.75.75 0 1 1-1.06-1.06l6.22-6.22H3a.75.75 0 0 1 0-1.5h16.19l-6.22-6.22a.75.75 0 0 1 0-1.06Z"
            clip-rule="evenodd" />
        </svg>
        }
      </button>
    </form>

    <!-- Login Link -->
    <div class="footer-link text-center pt-3 border-top">
      <p class="text-muted mb-0">
        ¿Ya tienes una cuenta?
        <a routerLink="/login" class="btn btn-link p-0 ms-1 login-link fw-semibold">
          Inicia sesión
        </a>
      </p>
    </div>

    <!-- Social Login Options -->
    <div class="social-divider my-4">
      <span class="px-3 bg-white text-muted small">o continúa con</span>
    </div>

    <div class="row g-2">
      <div class="col-6">
        <button type="button" class="btn btn-outline-google w-100">
          <svg viewBox="0 0 24 24" style="width: 20px; height: 20px;">
            <path fill="currentColor"
              d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
            <path fill="currentColor"
              d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
            <path fill="currentColor"
              d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" />
            <path fill="currentColor"
              d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" />
          </svg>
          Google
        </button>
      </div>
      <div class="col-6">
        <button type="button" class="btn btn-outline-facebook w-100">
          <svg viewBox="0 0 24 24" fill="currentColor" style="width: 20px; height: 20px;">
            <path
              d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
          </svg>
          Facebook
        </button>
      </div>
    </div>
  </div>
</div>
