<div class="home-container">
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top border-bottom shadow-sm navbar-custom"
        [class.logged-in]="!authService.isLoggedIn()">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 brand-text" routerLink="#">Tap Table</a>

            @if (!authService.isLoggedIn()) {
            <div class="d-flex gap-2">
                <a class="btn btn-primary btn-sm" routerLink="/login">Iniciar sesión</a>
                <a class="btn btn-outline-danger btn-sm" routerLink="/register">Registrá tu restaurante</a>
            </div>
            } @else {
            <div class="d-flex gap-3 align-items-center">
                <a class="text-dark fw-medium small" routerLink="/admin-page">{{ restaurantService.getRestaurantName() ?? 'Usuario' }}</a>
                <button class="btn btn-outline-danger btn-sm" (click)="logout()">Cerrar sesión</button>
            </div>
            }
        </div>
    </nav>


    <main class="main-container container-fluid">
        <router-outlet />
    </main>
